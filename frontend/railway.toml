# Railway config for the frontend service. Set this service's Root
# Directory to `frontend` in the Railway dashboard so this file is picked
# up — see README.md "Redeploying" for the full setup steps.
#
# Served by Caddy (see Caddyfile), not a plain static server — it reverse
# proxies /api/* to the backend over Railway's private network, which is
# what keeps the whole app on one origin from the browser's point of view.
# See api.js for why that matters (Firefox's Total Cookie Protection).
# VITE_API_BASE_URL doesn't need to be set at all anymore; api.js defaults
# to the relative "/api" this proxy expects.

[build]
builder = "NIXPACKS"
# Nixpacks already runs "npm ci" as its own separate install step before
# this — repeating it here (as "npm ci && npm run build") raced against
# the install step's cache-mounted node_modules/.cache directory and
# failed with EBUSY on the first real deploy.
buildCommand = "npm run build"

[deploy]
startCommand = "caddy run --config Caddyfile --adapter caddyfile"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
